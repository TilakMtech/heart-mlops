apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - monitoring/prometheus.yaml
  - monitoring/grafana.yaml

configMapGenerator:
  - name: grafana-dashboards
    namespace: heart-mlops
    files:
      - monitoring/heart_api.json
generatorOptions:
  disableNameSuffixHash: true
