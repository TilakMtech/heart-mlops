# LoadBalancer: on Minikube run `minikube tunnel` to get an external IP
# (on macOS + docker driver it appears as 127.0.0.1:8080).
apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-mlops
  labels: {app: heart-api}
spec:
  type: LoadBalancer
  selector: {app: heart-api}
  ports:
    - name: http
      port: 8080          # 8080 so it does not clash with the Ingress on :80 under `minikube tunnel`
      targetPort: http
